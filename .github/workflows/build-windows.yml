name: Windows installer

on:
  push:
    branches: [main, actions-test]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Override package version (e.g. 1.2.3)
        required: false
      create_release:
        description: Create a draft GitHub Release?
        type: boolean
        default: true
      draft_tag:
        description: Tag name for the test release (e.g. v0.0.0-test.1)
        required: false
        default: v0.0.0-test.1

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      npm_config_arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Point the build at the preinstalled vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLATION_ROOT\installed" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install C++ dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-binary-cache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$PWD\vcpkg-binary-cache,readwrite"
          & "$env:VCPKG_ROOT\vcpkg.exe" install --x-install-root="$env:VCPKG_INSTALLED_DIR"

      - name: Install JS dependencies
        run: npm ci

      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $v = if ($env:VERSION_INPUT) { $env:VERSION_INPUT } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          if ($v) { npm version $v --no-git-tag-version --allow-same-version }

      - name: Rebuild native addon for Electron
        run: npm run build:native

      - name: Smoke test addon
        run: node -e "const a = require('./build/Release/simulation_addon.node'); console.log(Object.keys(a))"

      - name: Build Squirrel installer
        run: npm run make

      - uses: actions/upload-artifact@v4
        with:
          name: digital-twin-app-windows-x64
          if-no-files-found: error
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES

  release:
    needs: build
    # Runs either on a real Git tag or when manually requested via workflow_dispatch
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: digital-twin-app-windows-x64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.draft_tag }}
        run: |
          # Determine the target tag name: git tag if triggered by tag, else manual input
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="${INPUT_TAG:-v0.0.0-test}"
          fi

          echo "Target tag: $TAG_NAME"

          # Create release as --draft if not already present
          gh release view "$TAG_NAME" > /dev/null 2>&1 || gh release create "$TAG_NAME" --draft --generate-notes
          
          # Upload build artifacts
          gh release upload "$TAG_NAME" dist/* --clobber
